[package]
name = "pranker-server"
version = "0.1.0"
edition = "2021"

[dependencies]
pranker-core = { path = "../pranker-core" }
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
futures-util = "0.3"
