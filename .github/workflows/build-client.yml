name: Build & Deploy Client Binary

on:
  push:
    branches:
      - main
    paths:
      - 'crates/pranker-client/**'
      - 'crates/pranker-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: write

jobs:
  build-windows-client:
    name: Build system-admin.exe for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build system-admin release binary
        run: cargo build --release --bin system-admin

      - name: Embed binary into server public directory
        run: |
          Copy-Item -Path "target/release/system-admin.exe" -Destination "crates/pranker-server/public/system-admin.exe" -Force

      - name: Commit and push updated system-admin.exe
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add crates/pranker-server/public/system-admin.exe
          git diff --quiet && git diff --staged --quiet || git commit -m "auto: Build and update system-admin.exe binary [skip ci]"
          git push
